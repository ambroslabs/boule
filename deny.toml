[graph]
all-features = false

# ── Security advisories ──────────────────────────────────────────────────────
[advisories]
version = 2
yanked = "deny"

# ── License policy ───────────────────────────────────────────────────────────
[licenses]
version = 2
# Permissive licenses compatible with GPL-3.0-only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
]

# ring uses a custom multi-source license (ISC + BoringSSL / OpenSSL heritage).
# Its Cargo.toml declares the non-standard SPDX identifier below.
[[licenses.exceptions]]
allow = ["LicenseRef-ring"]
name = "ring"

# ── Dependency sources ───────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
