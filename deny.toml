[graph]
all-features = false

# ── Security advisories ──────────────────────────────────────────────────────
[advisories]
version = 2
yanked = "deny"

# ── License policy ───────────────────────────────────────────────────────────
[licenses]
version = 2
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
]

# ── Dependency sources ───────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
