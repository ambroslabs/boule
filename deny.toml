[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` (proc-macro, pulled in transitively by alloy-primitives) is
    # flagged unmaintained, not vulnerable — a build-time token-pasting macro
    # with no runtime surface. No maintained drop-in replacement is wired
    # through the alloy stack yet, so accept it until alloy drops it.
    "RUSTSEC-2024-0436",
    # `proc-macro-error2` (transitive build-time proc-macro) is flagged
    # unmaintained, not vulnerable — no runtime surface. Accept until the
    # upstream that pulls it switches off it.
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    # `foldhash` (via alloy-primitives' hash maps) is Zlib — an OSI-approved,
    # FSF-free permissive license.
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
