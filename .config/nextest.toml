# cargo-nextest configuration.
#
# # Test groups
#
# `heavy-compute` is the cohort of tests that should never share a physical
# core with another heavy test. `max-threads = 1` means at most one test from
# this group runs at a time on a given runner; this keeps local
# `cargo nextest run` invocations honest and is the source of truth that the
# CI shard split mirrors.
#
# Two kinds of test live here:
#
#   1. CPU-bound tests (25-node sims, BLS pairing/PoP) that would slow each
#      other down by contending for cores.
#   2. Multi-node libp2p cluster integration tests (the
#      `test_libp2p_overlay_3_node_smoke` /
#      `test_consensus_status_endpoint_reports_live_progress` smoke tests).
#      These are not CPU-bound, but they stand up real nodes over loopback
#      sockets and must form a gossipsub mesh and commit within a budget.
#      (The `testnet_driver_test` cluster binary moved to the reth-linked
#      `boule-bundle` workspace in #897, so it is no longer in this workspace's
#      filter — its own workspace runs it serially.)
#      Under the default shard's `--test-threads=$(nproc)` they get starved
#      during the mesh-formation window and flake (compounded by #855: the
#      overlay does not re-dial bootstrap peers, so a startup dial race never
#      recovers). Run one-at-a-time they get a full core and converge fast.
#
# # Adding a new heavy test
#
# A test is "heavy" when it is CPU-bound *and* its isolated wall-clock is
# longer than a few seconds. Examples currently in the suite:
#
#   - 25-node consensus simulations (paused virtual time, but heavy routing
#     fan-out per yield).
#   - BLS pairing and proof-of-possession verification.
#
# To classify a new test as heavy:
#
#   1. Make sure its fully-qualified name matches one of the patterns in the
#      `filter` field below — either by naming convention (e.g. it lives in
#      `crypto::bls_key::tests`) or by adding a new pattern here.
#   2. If you added or changed a pattern, mirror it into the `HEAVY_FILTER`
#      env var in `.github/workflows/ci.yml`. CI uses the same expression to
#      route the test onto the dedicated shard.
#
# Keep the two filter expressions in sync. They are intentionally duplicated:
# this file governs local execution, the workflow governs CI sharding, and
# nextest does not expose a way to share the expression between them.

[test-groups]
heavy-compute = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/^consensus::sim::tests::gossip_25_node_/) + test(/^crypto::bls_key::tests::/) + test(/^crypto::sig_scheme::tests::bls_/) + test(test_libp2p_overlay_3_node_smoke) + test(test_consensus_status_endpoint_reports_live_progress)'
test-group = 'heavy-compute'
