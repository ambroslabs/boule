[package]
name = "boule-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

# This crate is intentionally NOT a member of any workspace. It hosts
# `cargo-fuzz` targets that are nightly-only (libFuzzer needs nightly's
# `-Z sanitizer`) and depend on `libfuzzer-sys`. Keeping it standalone
# means the stable `cargo test` / `cargo clippy` runs in CI never touch
# it.
#
# To run a target manually:
#   cargo +nightly fuzz run dispatch_ingress_skip -- -max_total_time=600
#
# See `README.md` for the recommended runtime budget.

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
boule-rs      = { path = ".." }
postcard      = { version = "1", default-features = false, features = ["use-std"] }
bytes         = { version = "1", features = ["serde"] }

[[bin]]
name = "dispatch_ingress_skip"
path = "fuzz_targets/dispatch_ingress_skip.rs"
test = false
doc = false
bench = false

# Helper that regenerates the committed initial corpus. Mirrors the
# wire-shape coverage of `src/consensus/wire_fuzz.rs` so libFuzzer
# starts from the same surface the proptest harness already exercises.
[[bin]]
name = "seed_corpus"
path = "src/bin/seed_corpus.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
