name: Smoke

# The multi-process testnet smoke sweep (crates/boule-bundle/tests/smoke_sweep.rs)
# spins up real clusters and is far too slow for the per-PR gate. The sweep
# test is `#[ignore]`d so the stable per-PR gate (fmt/clippy/test/deny in
# ci.yml) compiles it but never runs it. This workflow is the cadence guard:
# it runs the sweep on a nightly schedule and on demand, the same model as
# fuzz.yml — without ever blocking the per-PR gate.
#
# The sweep moved into the unified-binary workspace (boule-bundle) in #897: it
# spawns the single `boule` binary (`CARGO_BIN_EXE_boule`) + the `testnet`
# driver, exercising the reth-free `boule start` cluster path. Building the
# bundle links the reth SDK, so this job installs solc + the bindgen
# prerequisites and runs inside that standalone workspace.
on:
  schedule:
    # 07:00 America/Los_Angeles. GitHub cron is fixed UTC and does NOT
    # observe daylight saving, so 15:00 UTC = 07:00 PST (standard time) and
    # 08:00 PDT (daylight time). Pinned to standard-time 07:00 as requested.
    - cron: '0 15 * * *'
  workflow_dispatch:
  pull_request:
    # Adding the `smoke` label kicks off a run; the others re-run it on new
    # pushes while the label is still applied.
    types: [opened, synchronize, reopened, labeled]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  smoke:
    name: Testnet smoke sweep
    # Opt-in on PRs via the `smoke` label; always on nightly + manual dispatch.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'smoke'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/boule-bundle
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-solc
      - name: Install clang/bindgen prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
          gcc_inc=$(ls -d /usr/lib/gcc/x86_64-linux-gnu/*/include | sort -V | tail -1)
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$gcc_inc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          # This sweep is a slow `--release` build of the reth-linked bundle +
          # multi-process integration tests that can flake on an individual
          # trial. rust-cache skips saving on a failed job by default, so one
          # flaky trial would discard the whole expensive build cache and
          # force the next run to rebuild from scratch. Save regardless of
          # the test outcome.
          workspaces: crates/boule-bundle
          prefix-key: bundle
          cache-on-failure: true
      # Nightly schedule runs the full 65-trial sweep; PR/manual runs the
      # lighter `standard` tier to keep opt-in checks quick.
      - name: Smoke sweep
        env:
          SMOKE_TIER: ${{ github.event_name == 'schedule' && 'full' || 'standard' }}
        run: |
          cargo test --release --test smoke_sweep \
            -- --ignored --nocapture --test-threads=1
