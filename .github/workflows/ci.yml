name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Detect whether this change touches anything that affects build/test/lint
  # output. Pushes to main always run everything; PRs that only touch docs,
  # `.claude/**`, etc. short-circuit the heavy jobs to a no-op.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -E '(\.rs$|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^clippy\.toml$|^deny\.toml$|^\.github/workflows/)' >/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: Format
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.rust == 'true'
        uses: ./.github/actions/install-solc
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --all-targets -- -D warnings
      # Optional cargo features are off by default, so the line above never
      # compiles the feature-gated code. Lint the `reth` backend explicitly
      # so it can't silently rot (as the workspace-excluded fuzz crate did).
      # `-p boule-cli --features reth` is the user-facing build path and
      # transitively compiles boule-node's gated code too.
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy -p boule-cli --features reth --all-targets -- -D warnings

  test:
    # Two shards on separate runners to isolate tests that must not share a
    # core from the rest of the suite. The `heavy` shard runs serially
    # (`--test-threads=1`): compute-heavy tests (sims, BLS) plus the
    # multi-node libp2p cluster integration tests, whose mesh-formation
    # liveness is starved under the default shard's full parallelism. The
    # `default` shard runs everything else at the runner's natural
    # parallelism (no oversubscription).
    #
    # `HEAVY_FILTER` is the canonical filter expression that selects the
    # heavy cohort. KEEP IN SYNC with `.config/nextest.toml`'s
    # `[[profile.default.overrides]].filter` — see the comment in that file
    # for the convention.
    name: Test (${{ matrix.shard }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [heavy, default]
    env:
      HEAVY_FILTER: 'test(/^consensus::sim::tests::gossip_25_node_/) + test(/^crypto::bls_key::tests::/) + test(/^crypto::sig_scheme::tests::bls_/) + binary(testnet_driver_test) + test(test_libp2p_overlay_3_node_smoke) + test(test_consensus_status_endpoint_reports_live_progress)'
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.rust == 'true'
        uses: ./.github/actions/install-solc
      - if: needs.changes.outputs.rust == 'true'
        name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - if: needs.changes.outputs.rust == 'true' && matrix.shard == 'heavy'
        name: Heavy shard (serialized — compute-bound + multi-node clusters)
        run: cargo nextest run --locked --all-targets -E "$HEAVY_FILTER" --test-threads=1
      - if: needs.changes.outputs.rust == 'true' && matrix.shard == 'default'
        name: Default shard (everything else, parallel)
        run: cargo nextest run --locked --all-targets -E "not ($HEAVY_FILTER)" --test-threads=$(nproc)
      - if: needs.changes.outputs.rust == 'true' && matrix.shard == 'default'
        name: Doctests
        run: cargo test --locked --doc -- --test-threads=$(nproc)

  deny:
    name: Deny (licenses + advisories)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: Docs (intra-doc links)
    needs: changes
    runs-on: ubuntu-latest
    # Fail on broken intra-doc links so doc references can't silently rot
    # when items move between modules/crates (e.g. a refactor). Scoped to
    # the broken-links lint; `private_intra_doc_links` stays a warning.
    env:
      RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.rust == 'true'
        uses: ./.github/actions/install-solc
      - if: needs.changes.outputs.rust == 'true'
        run: cargo doc --workspace --no-deps --document-private-items
