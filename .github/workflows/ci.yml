name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Applies to the `cargo doc` step in the build job below.
  RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # clippy + doc + test in ONE job sharing a single `target/`. The reth
  # dependency tree compiles in two cargo modes — check (clippy/doc) and codegen
  # (test). Running them in one job compiles reth twice total (clippy does the
  # check build, which doc reuses; test does the one codegen build) instead of
  # three separate jobs each compiling reth and racing to write one cache.
  build:
    name: clippy + doc + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for the one compile job. Save only from main so PR
          # branches stay restore-only and don't each persist a multi-GB copy
          # (keeps the repo under GitHub's 10 GB Actions-cache limit).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/install-solc
      - name: Install clang/libclang (reth mdbx/rocksdb bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      # check-mode compile of the whole tree + lints; doc reuses these artifacts.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p boule-cli --features reth --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps --document-private-items
      # the one codegen build; also link-checks the reth-linked binaries.
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
