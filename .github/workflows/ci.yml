name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Detect whether this change touches anything that affects build/test/lint
  # output. Pushes to main always run everything; PRs that only touch docs,
  # `.claude/**`, etc. short-circuit the heavy jobs to a no-op.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'deny.toml'
              - '.github/workflows/**'

  fmt:
    name: Format
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - if: needs.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - if: needs.changes.outputs.rust == 'true'
        run: cargo nextest run --locked --all-targets
      - if: needs.changes.outputs.rust == 'true'
        run: cargo test --locked --doc

  deny:
    name: Deny (licenses + advisories)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
