name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Set workflow-wide so the clippy/test/docs jobs hash to the same rust-cache
  # environment key and can therefore share one cache (see the `shared-key`
  # below). Harmless on the non-doc jobs.
  RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache shared by clippy/test/docs; only the test job writes it
          # (its full `--all-targets` build is a superset of what clippy's
          # check and docs' rustdoc need), and only on main.
          shared-key: workspace
          save-if: "false"
      - uses: ./.github/actions/install-solc
      - name: Install clang/libclang (reth mdbx/rocksdb bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p boule-cli --features reth --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The single writer of the shared cache; only persist from main so PR
          # branches stay restore-only and don't each store a multi-GB copy
          # (keeps the repo under GitHub's 10 GB Actions-cache limit).
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/install-solc
      - name: Install clang/libclang (reth mdbx/rocksdb bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - run: cargo test --locked --all-targets
      - name: Doctests
        run: cargo test --locked --doc

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: "false"
      - uses: ./.github/actions/install-solc
      - name: Install clang/libclang (reth mdbx/rocksdb bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - run: cargo doc --workspace --no-deps --document-private-items

