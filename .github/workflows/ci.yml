name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Applies to the `cargo doc` step in the build job below.
  RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # clippy + doc + test in ONE job sharing a single `target/`. The reth
  # dependency tree compiles in two cargo modes — check (clippy/doc) and codegen
  # (test). Running them in one job compiles reth twice total (clippy does the
  # check build, which doc reuses; test does the one codegen build) instead of
  # three separate jobs each compiling reth and racing to write one cache.
  build:
    name: clippy + doc + test
    # Blacksmith 4-vCPU runner: faster cold reth builds, and Swatinem/rust-cache
    # transparently uses Blacksmith's colocated cache (no GitHub 10 GB limit,
    # ~4x faster) with no action change. fmt/deny stay on free GitHub runners.
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # On Blacksmith this transparently uses the colocated cache (no GitHub
      # 10 GB limit), so we let PRs save too (default save-if: true): a PR that
      # changes deps reuses its own cache across re-pushes instead of cold-
      # building reth each time. Caches are branch-scoped, so PRs never pollute
      # main or each other.
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-solc
      - name: Install clang/libclang (reth mdbx/rocksdb bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      # check-mode compile of the whole tree + lints; doc reuses these artifacts.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p boule-cli --features reth --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps --document-private-items
      # the one codegen build; also link-checks the reth-linked binaries.
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
