name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Detect whether this change touches anything that affects build/test/lint
  # output. Pushes to main always run everything; PRs that only touch docs,
  # `.claude/**`, etc. short-circuit the heavy jobs to a no-op.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      bundle: ${{ steps.filter.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "bundle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -E '(\.rs$|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^clippy\.toml$|^deny\.toml$|^\.github/workflows/)' >/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          # The unified `boule` binary (boule-bundle) links the reth SDK, so its
          # lane is heavy. Gate it tightly: only run when the bundle itself, the
          # reth-side crates it composes, or the boule-side crates whose
          # subcommands/runtime it hosts change (plus this workflow).
          if echo "$changed" | grep -E '^(crates/boule-(bundle|reth-node|reth|cli|consensus|node|core|transport-libp2p)/|\.github/workflows/ci\.yml$)' >/dev/null; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle=false" >> "$GITHUB_OUTPUT"
          fi

  # Ensure the toolchain image (rust + clang + solc + sccache + nextest) exists
  # in GHCR for THIS commit's builder inputs, then hand its content-addressed ref
  # to every compiling job (which `needs:` this job, so the image is guaranteed
  # published before they run). Build+push only when missing — when the toolchain
  # is unchanged this is a ~2-second manifest check. The hash tag is pushed even
  # on PRs (immutable; a PR can't clobber `:latest`), so a toolchain-changing PR
  # gets its own image.
  builder:
    name: Builder image
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          tag=$(echo "${{ hashFiles('docker/Dockerfile.builder', 'rust-toolchain.toml') }}" | cut -c1-16)
          echo "image=ghcr.io/${{ github.repository_owner }}/boule-builder:$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: exists
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
            echo "builder image already published: ${{ steps.meta.outputs.image }}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "builder image missing — building + pushing"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.builder
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # On main, move :latest to the current toolchain so local `make build`
      # (which pulls :latest) tracks it.
      - if: github.ref == 'refs/heads/main'
        run: docker buildx imagetools create -t "ghcr.io/${{ github.repository_owner }}/boule-builder:latest" "${{ steps.meta.outputs.image }}"

  # fmt and deny don't compile (rustfmt / cargo-deny read source + metadata), so
  # they stay native — no builder image, no sccache needed.
  fmt:
    name: Format
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check

  deny:
    name: Deny (licenses + advisories)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2

  clippy:
    name: Clippy
    needs: [changes, builder]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: ./.github/actions/cargo-build
        with:
          # The plain lint never compiles the feature-gated code; lint the `reth`
          # backend explicitly too so it can't silently rot.
          run: |
            set -e
            cargo clippy --all-targets -- -D warnings
            cargo clippy -p boule-cli --features reth --all-targets -- -D warnings
          image: ${{ needs.builder.outputs.image }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          cache-key: root

  test:
    # Two shards on separate runners. The `heavy` shard runs serially
    # (`--test-threads=1`): compute-heavy tests (sims, BLS) + the multi-node
    # libp2p cluster integration tests, whose mesh-formation liveness is starved
    # under full parallelism. The `default` shard runs everything else at the
    # runner's natural parallelism. Keep HEAVY_FILTER in sync with
    # `.config/nextest.toml`'s `[[profile.default.overrides]].filter`.
    name: Test (${{ matrix.shard }})
    needs: [changes, builder]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [heavy, default]
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true' && matrix.shard == 'heavy'
        name: Heavy shard (serialized — compute-bound + multi-node clusters)
        uses: ./.github/actions/cargo-build
        with:
          run: |
            HEAVY_FILTER='test(/^consensus::sim::tests::gossip_25_node_/) + test(/^crypto::bls_key::tests::/) + test(/^crypto::sig_scheme::tests::bls_/) + test(test_libp2p_overlay_3_node_smoke) + test(test_consensus_status_endpoint_reports_live_progress)'
            cargo nextest run --locked --all-targets -E "$HEAVY_FILTER" --test-threads=1
          image: ${{ needs.builder.outputs.image }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          cache-key: root
      - if: needs.changes.outputs.rust == 'true' && matrix.shard == 'default'
        name: Default shard (everything else) + doctests
        uses: ./.github/actions/cargo-build
        with:
          run: |
            set -e
            HEAVY_FILTER='test(/^consensus::sim::tests::gossip_25_node_/) + test(/^crypto::bls_key::tests::/) + test(/^crypto::sig_scheme::tests::bls_/) + test(test_libp2p_overlay_3_node_smoke) + test(test_consensus_status_endpoint_reports_live_progress)'
            cargo nextest run --locked --all-targets -E "not ($HEAVY_FILTER)" --test-threads="$(nproc)"
            cargo test --locked --doc -- --test-threads="$(nproc)"
          image: ${{ needs.builder.outputs.image }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          cache-key: root

  docs:
    name: Docs (intra-doc links)
    needs: [changes, builder]
    runs-on: ubuntu-latest
    # Fail on broken intra-doc links so doc references can't silently rot.
    env:
      RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.rust == 'true'
        uses: ./.github/actions/cargo-build
        with:
          run: cargo doc --workspace --no-deps --document-private-items
          image: ${{ needs.builder.outputs.image }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          cache-key: root

  # The single, unified `boule` binary (boule-bundle) links the reth SDK
  # IN-PROCESS in its own standalone workspace — the only lane that builds reth.
  # It builds the binary, checks the subcommand surface, runs the relocated CLI
  # integration tests, and runs the single-process `boule node` smoke. Heavy, so
  # path-gated to the bundle/reth/cli/consensus/node/core crates, and the reth
  # build is reused across runs via sccache→Spaces (inside the builder image).
  bundle:
    name: Unified boule binary (reth in-process)
    needs: [changes, builder]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.bundle == 'true'
        uses: ./.github/actions/cargo-build
        with:
          working-directory: crates/boule-bundle
          cache-key: bundle
          image: ${{ needs.builder.outputs.image }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          # --test-threads=1 on the cluster/smoke tests: each spawns its own
          # in-process reth; parallel runs clash + starve mesh-formation budgets.
          run: |
            set -e
            cargo fmt --all --check
            cargo clippy --locked --all-targets -- -D warnings
            cargo build --locked --bins
            help=$(cargo run --locked --bin boule -- --help)
            echo "$help"
            for sub in node init start genesis faucet rpc-proxy key config snapshot reconfig rotation endpoint; do
              echo "$help" | grep -qw "$sub" || { echo "MISSING SUBCOMMAND: $sub"; exit 1; }
            done
            cargo test --locked --test integration_test --test testnet_driver_test --test smoke_sweep -- --test-threads=1
            cargo test --locked --test bundle_smoke -- --ignored --nocapture --test-threads=1
