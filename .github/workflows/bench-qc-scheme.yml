name: Bench (QC scheme bandwidth)

# Manually-triggered: not part of the per-PR CI pipeline. Variance on
# a shared runner makes this unsuitable as a gate; use it on demand to
# refresh the canonical numbers in `docs/operations.md`.
on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: 'Open a PR with the regenerated numbers table'
        required: false
        default: 'true'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench:
    name: Run bench
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run benchmark
        id: bench
        run: |
          set -euo pipefail
          mkdir -p target/bench
          # Run the bench in --release; capture stdout for both the
          # artifact upload and the table-regeneration step below.
          cargo test --release --locked --test qc_scheme_bandwidth \
            --ignored -- --nocapture --test-threads=1 \
            | tee target/bench/raw.txt

      - name: Upload raw output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: qc-scheme-bench-raw
          path: target/bench/raw.txt
          if-no-files-found: error

      - name: Regenerate operations.md table
        if: ${{ inputs.open_pr == 'true' }}
        run: |
          set -euo pipefail
          # Extract the bench's columnar output into a markdown table.
          # The bench prints a header, a separator line of box-drawing
          # characters, then one row per validator-set size.
          python3 - <<'PY'
          import re
          import pathlib

          raw = pathlib.Path("target/bench/raw.txt").read_text()
          # Lines that look like "<n> <q> <wire> <agg> <verify> <wire> <verify>"
          # — five whitespace-separated numeric columns after the n + q.
          rows = []
          for line in raw.splitlines():
              parts = line.split()
              if len(parts) != 7:
                  continue
              if parts[0] == "n":
                  continue
              try:
                  int(parts[0])
              except ValueError:
                  continue
              rows.append(parts)
          if not rows:
              raise SystemExit("bench produced no parseable rows")

          table = [
              "<!-- BENCH:BEGIN -->",
              "| n   | quorum | ed wire B | ed agg µs | ed verify µs | bls wire B | bls verify µs |",
              "| --: | -----: | --------: | --------: | -----------: | ---------: | ------------: |",
          ]
          for r in rows:
              n, q, ew, ea, ev, bw, bv = r
              table.append(f"| {n:<3} | {q:>6} | {ew:>9} | {ea:>9} | {ev:>12} | {bw:>10} | {bv:>13} |")
          table.append("<!-- BENCH:END -->")
          new_block = "\n".join(table)

          ops = pathlib.Path("docs/operations.md")
          text = ops.read_text()
          updated = re.sub(
              r"<!-- BENCH:BEGIN -->[\s\S]*?<!-- BENCH:END -->",
              new_block.replace("\\", "\\\\"),
              text,
              count=1,
          )
          if updated == text:
              raise SystemExit("BENCH:BEGIN/END markers not found in docs/operations.md")
          ops.write_text(updated)
          print("Regenerated docs/operations.md table")
          PY

      - name: Open PR with regenerated table
        if: ${{ inputs.open_pr == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bench/qc-scheme-${{ github.run_id }}
          commit-message: "docs: refresh QC scheme bandwidth numbers"
          title: "docs: refresh QC scheme bandwidth numbers"
          body: |
            Regenerated by the `bench-qc-scheme` workflow (run ${{ github.run_id }}).

            Updates the canonical bandwidth/CPU numbers in
            `docs/operations.md` from a fresh run of
            `tests/qc_scheme_bandwidth.rs` on a `ubuntu-latest` GitHub-hosted runner.

            Variance between runs is typically ±15% on timing columns;
            wire-byte numbers are exact.
          add-paths: docs/operations.md
