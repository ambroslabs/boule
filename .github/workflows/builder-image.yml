name: Builder image

# Publishes the toolchain image (ghcr.io/<owner>/boule-builder) that CI and
# local dev run the actual cargo build inside. Rebuilt only when the toolchain /
# system deps change — keyed by a hash of the builder Dockerfile + toolchain pin.
on:
  push:
    branches: [main]
    paths:
      - docker/Dockerfile.builder
      - rust-toolchain.toml
      - .github/workflows/builder-image.yml
  pull_request:
    paths:
      - docker/Dockerfile.builder
      - rust-toolchain.toml
      - .github/workflows/builder-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.builder
          # Build on PRs (so a builder change is validated), but only push to
          # GHCR from main — PRs use the current published :latest.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/boule-builder:latest
            ghcr.io/${{ github.repository_owner }}/boule-builder:${{ hashFiles('docker/Dockerfile.builder', 'rust-toolchain.toml') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
