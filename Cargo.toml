[workspace]
resolver = "2"
members = [
    "crates/boule-core",
    "crates/boule-transport-libp2p",
    "crates/boule-consensus",
    "crates/boule-node",
    "crates/boule-cli",
    "crates/boule-reth",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ambroslabs/boule"
homepage = "https://github.com/ambroslabs/boule"
readme = "README.md"
keywords = ["blockchain", "consensus", "bft", "hotstuff"]
categories = ["network-programming", "cryptography"]
