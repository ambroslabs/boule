[workspace]
resolver = "2"
members = [
    "crates/boule-core",
    "crates/boule-transport-libp2p",
    "crates/boule-consensus",
    "crates/boule-node",
    "crates/boule-cli",
    "crates/boule-reth",
]
# `fuzz` is intentionally excluded: it hosts nightly-only `cargo-fuzz`
# targets and must not be pulled into the stable workspace build.
#
# `crates/boule-reth-node` is its OWN standalone workspace (Option A custom EL,
# #777). It is excluded here so its heavy `reth-ethereum` SDK dependency tree
# (hundreds of crates) never enters boule's main build / Cargo.lock / CI. Build
# it from its own directory with `--jobs 3`; see its Cargo.toml header.
exclude = ["fuzz", "crates/boule-reth-node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ambroslabs/boule"
homepage = "https://github.com/ambroslabs/boule"
readme = "README.md"
keywords = ["consensus", "bft", "hotstuff", "p2p", "distributed-systems"]
categories = ["network-programming", "cryptography"]
