[workspace]
resolver = "2"
members = [
    "crates/boule-core",
    "crates/boule-transport-libp2p",
    "crates/boule-consensus",
    "crates/boule-node",
    "crates/boule-cli",
    "crates/boule-reth",
    "crates/boule-reth-node",
    "crates/boule-bundle",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ambroslabs/boule"
homepage = "https://github.com/ambroslabs/boule"
readme = "README.md"
keywords = ["blockchain", "consensus", "bft", "hotstuff"]
categories = ["network-programming", "cryptography"]

# Shared reth SDK + alloy deps, pinned once so the EL crates (boule-reth,
# boule-reth-node, boule-bundle) stay version-locked. reth is a LIBRARY
# dependency (no source fork), pinned to the v2.2.0 tag.
[workspace.dependencies]
reth-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", features = [
    "node",
    "node-api",
    "evm",
    "cli",
] }
reth-payload-builder = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-basic-payload-builder = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-ethereum-payload-builder = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-payload-validator = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
alloy-evm = "0.34.0"
alloy-consensus = { version = "2", features = ["k256"] }
alloy-primitives = "1"
alloy-signer = "2"
alloy-signer-local = "2"
alloy-eips = "2"
alloy-sol-types = "1.5.6"
alloy-trie = "0.9"
alloy-rlp = "0.3"
nybbles = "0.4"
