[package]
name = "boule-reth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reth execution-layer backend for boule: drives a reth EVM node over the Engine API (V3) so boule consensus can order Ethereum execution payloads. Implements the boule consensus `Application` seam."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
boule-core      = { path = "../boule-core", version = "0.1.0" }
boule-consensus = { path = "../boule-consensus", version = "0.1.0" }
anyhow     = "1"
bytes      = { version = "1", features = ["serde"] }
serde      = { version = "1", features = ["derive"] }
parking_lot = "0.12"
tracing    = "0.1"
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = "1"
# `rt-multi-thread`/`macros` are for the `drive-custom-el` live-proof binary
# (#781); the library itself only uses `time`.
tokio      = { version = "1", features = ["time", "rt-multi-thread", "macros"] }
hex        = "0.4"
base64     = "0.22"
hmac       = "0.12"
sha2       = "0.10"
# keccak256 for deriving Solidity storage slots (the genesis registry seed).
sha3       = "0.10"
# alloy: build/sign EIP-1559 system txs and recover their sender (#732 write
# path). `k256` enables sender recovery from a signature (used by the unit
# tests and any future verification path).
alloy-consensus    = { workspace = true }
alloy-primitives   = { workspace = true }
alloy-signer       = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-eips         = { workspace = true }
# ABI-encode the slashing/governance predeploy calls the `el-e2e-ops` helper
# submits in the A1 Phase-5 e2e (#785).
alloy-sol-types    = { workspace = true }
# #797 vote-time weight proof: build + verify a receipt-trie (MPT) inclusion
# proof of the staking/slashing log a weight delta is derived from, against the
# source block's `receiptsRoot`. `alloy-trie` is the vetted MPT verifier
# (`proof::verify_proof`) + builder (`HashBuilder` + `ProofRetainer`);
# `alloy-rlp` + `nybbles` give the receipt/key RLP + nibble path.
alloy-trie         = { workspace = true }
alloy-rlp          = { workspace = true }
nybbles            = { workspace = true }

[build-dependencies]
# `build.rs` generates genesis.json from genesis.template.json + the compiled
# contracts/*.sol; preserve_order keeps the template's key order in the output.
serde_json = { version = "1", features = ["preserve_order"] }
