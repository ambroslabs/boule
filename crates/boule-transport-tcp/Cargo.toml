[package]
name = "boule-transport-tcp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "TCP/TLS transport implementation for boule: authenticated transport, peer manager, RPC, and the gossip overlay implementing boule-transport."
repository = "https://github.com/ambroslabs/boule"
homepage = "https://github.com/ambroslabs/boule"

[dependencies]
boule-core      = { path = "../boule-core", version = "0.1.0" }
boule-transport = { path = "../boule-transport", version = "0.1.0" }
tokio           = { version = "1", features = ["full"] }
tokio-util      = { version = "0.7", features = ["codec"] }
bytes           = { version = "1", features = ["serde"] }
anyhow          = "1"
tracing         = "0.1"
futures-util    = { version = "0.3", features = ["sink"] }
serde           = { version = "1", features = ["derive"] }
postcard        = { version = "1", default-features = false, features = ["use-std"] }
parking_lot     = "0.12"
rcgen           = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls          = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls    = { version = "0.26", default-features = false, features = ["ring"] }
ring            = "0.17"
bs58            = "0.5"
sha2            = "0.10"
rand            = "0.9"
rand_chacha     = "0.9"
axum            = "0.8"
chrono          = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio           = { version = "1", features = ["full", "test-util"] }
tempfile        = "3"
proptest        = { version = "1", default-features = false, features = ["std", "bit-set"] }
zeroize         = { version = "1", features = ["derive"] }
