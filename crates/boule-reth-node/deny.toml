# cargo-deny config for the STANDALONE boule-reth-node workspace (#777, #784).
#
# boule-reth-node is excluded from the root workspace, so the root `deny.toml`
# (run by the main CI `deny` job) never sees its dependency tree. This file
# mirrors the root posture and adds the extra allowances the reth/alloy/revm SDK
# tree pulls in. Run from this directory:
#
#   cargo deny --all-features check
#
# When bumping reth (see UPGRADING.md), re-run `cargo deny check` and reconcile
# any newly surfaced license/advisory here rather than in the root config.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` (proc-macro, pulled in transitively by alloy-primitives) is
    # flagged unmaintained, not vulnerable — a build-time token-pasting macro
    # with no runtime surface. Mirrors the root deny.toml ignore.
    "RUSTSEC-2024-0436",

    # --- pinned transitively by reth v2.2.0; only fixable by a reth bump ---
    # (Re-check every entry below when bumping reth — see UPGRADING.md. The fix
    #  for the hickory advisories ships in hickory 0.26.x, which reth pulls in a
    #  later release; do NOT carry these ignores forward once reth no longer
    #  resolves the affected versions.)
    #
    # `bincode` 1.3.3 unmaintained (informational, not a vulnerability). Pulled
    # in transitively by the reth tree; no runtime CVE surface.
    "RUSTSEC-2025-0141",
    # `hickory-proto`/`hickory-resolver` 0.25.2 (via reth-dns-discovery →
    # reth-network): DoS-class advisories in DNS handling. Reached only on
    # reth's optional DNS peer-discovery path, not on boule's registry
    # system-call path. Fixed in hickory 0.26.x; gated on a reth upgrade.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
]

[licenses]
version = 2
# Base set is the root deny.toml allow-list; the entries below the blank line
# are additions required by the reth/alloy/revm dependency tree only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    # `foldhash` (via alloy-primitives' hash maps) is Zlib — OSI-approved, FSF-free.
    "Zlib",

    # --- additions for the reth/alloy/revm SDK tree (boule-reth-node only) ---
    # `doctest-file`, `recvmsg`: 0BSD — a maximally permissive (public-domain-
    # equivalent) license, no notice required.
    "0BSD",
    # `webpki-roots` / `webpki-root-certs`: the Mozilla CA bundle, CDLA-Permissive-2.0
    # (a permissive data license; the crate ships cert data, not code).
    "CDLA-Permissive-2.0",
    # `fastrlp`, `bitmaps`/`imbl`/`imbl-sized-chunks` (MPL-2.0[+]): weak/file-level
    # copyleft. We do not modify these files, so the obligation is satisfied by
    # using them unmodified. No proprietary linking concern for an open-source node.
    "MPL-2.0",
    # `async_io_stream`, `pharos`, `ws_stream_wasm`: Unlicense (public-domain
    # dedication). Reached only via wasm-target deps; harmless on the node build.
    "Unlicense",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The reth SDK is pulled from git (the v2.2.0 tag), and reth itself pins a git
# `discv5` (sigp). The root config has no git deps; allow exactly these two
# upstreams so `unknown-git` ("deny") doesn't reject the pinned SDK source.
# Re-check this list when bumping reth — a new release may move a git pin.
[sources.allow-org]
github = ["paradigmxyz", "sigp"]

[bans]
multiple-versions = "warn"
# The root config denies wildcards, but the four reth SDK crates are git-tag
# deps (`tag = "v2.2.0"`) with no semver requirement — cargo-deny counts those
# as wildcards even though the git tag is a hard pin. Allow git/path wildcards
# (the tag is the real version lock) while still flagging registry wildcards.
wildcards = "deny"
allow-wildcard-paths = true
