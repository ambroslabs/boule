# boule-reth-node — the custom reth execution-layer node (Option A, #777).
#
# A workspace member like every other crate. The shared reth SDK + alloy deps
# are pinned once in the root `[workspace.dependencies]` table and referenced
# here with `.workspace = true`.
#
# Build prerequisites on a fresh box (reth's mdbx-sys runs bindgen via libclang;
# solc is needed if you regenerate genesis). If bindgen cannot find the C system
# headers (stdarg.h / stdbool.h), install `clang libclang-dev`, or point it at
# gcc's include dir:
#   export BINDGEN_EXTRA_CLANG_ARGS="-I/usr/lib/gcc/x86_64-linux-gnu/15/include"
[package]
name = "boule-reth-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Custom reth execution-layer node for boule: applies the registry writes (recordKey/recordWeight/recordSettled) as deterministic system calls at the block boundary, fed by a custom extra_data channel (Option A, #777)."

[[bin]]
name = "boule-reth-node"
path = "src/main.rs"

[dependencies]
# reth as a LIBRARY (no source fork), pinned to the v2.2.0 tag in the root
# workspace dep table; matches the local `reth` binary (commit 88505c7).
reth-ethereum = { workspace = true }

# Payload-builder crates the custom payload builder + engine validator need.
# The custom builder transcribes the registry payload into `extra_data` by
# calling `default_ethereum_payload`.
reth-payload-builder = { workspace = true }
reth-basic-payload-builder = { workspace = true }
reth-ethereum-payload-builder = { workspace = true }
# The shanghai/cancun/prague new-payload field checks. We replicate
# `EthereumExecutionPayloadValidator::ensure_well_formed_payload` in the custom
# engine validator (to bypass alloy's hardcoded 32-byte `extra_data` cap on the
# verify path — #791), and these are the per-hardfork checks it runs.
reth-payload-validator = { workspace = true }

# alloy-evm carries `EthBlockExecutionCtx` and the block-executor traits.
alloy-evm = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-primitives = { workspace = true }
# NOTE: do NOT depend on `alloy-rpc-types-engine` directly — reth v2.2.0 pins its
# own version (2.0.5), and a second copy here causes "multiple versions of crate
# alloy_rpc_types_engine" trait mismatches. We use reth's re-export
# (`reth_ethereum::rpc::types::engine`) so it is the SAME crate instance.

serde = { version = "1", features = ["derive"] }
hex = "0.4"
eyre = "0.6"
