[package]
name = "boule-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transport interface for boule: object-safe broadcast/discovery traits and rate-limit policy, independent of any concrete transport."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/boule-transport"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
boule-core  = { path = "../boule-core", version = "0.1.0" }
bytes       = { version = "1", features = ["serde"] }
tokio       = { version = "1", features = ["full"] }
parking_lot = "0.12"

[dev-dependencies]
tokio       = { version = "1", features = ["full", "test-util"] }
chrono      = { version = "0.4", features = ["serde"] }
