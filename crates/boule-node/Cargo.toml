[package]
name = "boule-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Top-level node runtime for boule: wires consensus + replication over the TCP transport, plus the consensus driver, testnet driver, and simulator."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/boule-node"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Build the reth execution-layer backend (`[consensus.application] backend
# = "reth"`). Pulls in `boule-reth`; off by default so the standard build
# stays lean. A config that selects the reth backend without this feature
# fails at startup with a clear error.
reth = ["dep:boule-reth"]

[dependencies]
boule-core          = { path = "../boule-core", version = "0.1.0" }
boule-transport-libp2p = { path = "../boule-transport-libp2p", version = "0.1.0" }
boule-consensus     = { path = "../boule-consensus", version = "0.1.0" }
boule-reth          = { path = "../boule-reth", version = "0.1.0", optional = true }
tokio               = { version = "1", features = ["full"] }
tokio-util          = { version = "0.7", features = ["codec"] }
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
bytes               = { version = "1", features = ["serde"] }
anyhow              = "1"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json"] }
hex                 = "0.4"
futures-util        = { version = "0.3", features = ["sink"] }
axum                = "0.8"
# Prometheus text-format exporter (#808). `default-features = false` drops
# the protobuf push-gateway path; we only need the registry + `TextEncoder`.
prometheus          = { version = "0.14", default-features = false }
postcard            = { version = "1", default-features = false, features = ["use-std"] }
parking_lot         = "0.12"
reqwest             = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
libc                = "0.2"
sha2                = "0.10"
chrono              = { version = "0.4", features = ["serde"] }
rand                = "0.9"
rand_chacha         = "0.9"
bs58                = "0.5"
tempfile            = "3"
toml                = "1"
zeroize             = { version = "1", features = ["derive"] }

[dev-dependencies]
# Enable the crash-injection seam in consensus for the crash-recovery sim.
boule-consensus     = { path = "../boule-consensus", version = "0.1.0", features = ["crashpoints", "testing"] }
boule-core          = { path = "../boule-core", version = "0.1.0", features = ["testing"] }
tokio               = { version = "1", features = ["full", "test-util"] }
proptest            = { version = "1", default-features = false, features = ["std", "bit-set"] }
tempfile            = "3"
rcgen               = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Drive axum routers in-process (`ServiceExt::oneshot`) for the API tests.
tower               = { version = "0.5", features = ["util"] }
http-body-util      = "0.1"
