[package]
name = "boule-node"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Top-level node runtime for boule: wires consensus + replication over the TCP transport, plus the consensus driver, testnet driver, and simulator."
repository = "https://github.com/ambroslabs/boule-rs"
homepage = "https://github.com/ambroslabs/boule-rs"

[dependencies]
boule-rs            = { path = "../boule-rs", version = "0.1.0" }
boule-transport     = { path = "../boule-transport", version = "0.1.0" }
boule-transport-tcp = { path = "../boule-transport-tcp", version = "0.1.0" }
boule-consensus     = { path = "../boule-consensus", version = "0.1.0" }
tokio               = { version = "1", features = ["full"] }
tokio-util          = { version = "0.7", features = ["codec"] }
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
bytes               = { version = "1", features = ["serde"] }
anyhow              = "1"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json"] }
hex                 = "0.4"
futures-util        = { version = "0.3", features = ["sink"] }
axum                = "0.8"
postcard            = { version = "1", default-features = false, features = ["use-std"] }
parking_lot         = "0.12"
reqwest             = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
libc                = "0.2"
sha2                = "0.10"
chrono              = { version = "0.4", features = ["serde"] }
rand                = "0.9"
rand_chacha         = "0.9"
bs58                = "0.5"
tempfile            = "3"
toml                = "1"
zeroize             = { version = "1", features = ["derive"] }

[dev-dependencies]
# Enable the crash-injection seam in consensus for the crash-recovery sim.
boule-consensus     = { path = "../boule-consensus", version = "0.1.0", features = ["crashpoints", "testing"] }
boule-rs            = { path = "../boule-rs", version = "0.1.0", features = ["testing"] }
tokio               = { version = "1", features = ["full", "test-util"] }
proptest            = { version = "1", default-features = false, features = ["std", "bit-set"] }
tempfile            = "3"
rcgen               = { version = "0.13", default-features = false, features = ["ring", "pem"] }
