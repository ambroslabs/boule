[package]
name = "boule-bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Single-binary boule node: HotStuff consensus + the custom reth execution layer (BouleNode) in one process, reth in-process over its auth-server IPC client (no HTTP Engine API, no JWT). Milestone #7."

[[bin]]
name = "boule"
path = "src/main.rs"

[dependencies]
boule-reth-node = { path = "../boule-reth-node", version = "0.1.0" }
boule-core = { path = "../boule-core", version = "0.1.0" }
boule-consensus = { path = "../boule-consensus", version = "0.1.0" }
boule-node = { path = "../boule-node", version = "0.1.0", features = ["reth"] }
boule-reth = { path = "../boule-reth", version = "0.1.0" }
boule-cli = { path = "../boule-cli", version = "0.1.0", features = ["reth"] }

reth-ethereum = { workspace = true, features = ["tasks", "provider"] }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
hex = "0.4"
jsonrpsee = { version = "0.26", features = ["async-client", "http-client", "client-core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
