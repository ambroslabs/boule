[package]
name = "boule-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The reth-free boule CLI command tree (library) for a HotStuff-style BFT consensus layer."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/boule-cli"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# This crate is a LIBRARY: it exposes the reth-free `boule` command tree
# (`cli::Command` + `cli::dispatch`). The single user-facing `boule` binary is
# produced by `boule-bundle` (reth-linked), which flattens this command tree
# alongside its own `node` subcommand. There is exactly one `boule` binary in
# the repo, and it is NOT here.
#
# The `testnet` driver binary is auto-discovered from src/bin/testnet.rs; it
# stays here so the root-workspace integration tests can spawn it.

[features]
# Build the reth-gated subcommands (`genesis`/`faucet`/`rpc-proxy`). Passes
# through to
# boule-node's `reth` feature and pulls in `boule-reth` for the reth-only
# `genesis` / `faucet` / `rpc-proxy` subcommands; off by default so the
# standard binary stays lean. See `../boule-reth/node-demo.md` for running a
# chain.
reth = ["boule-node/reth", "dep:boule-reth"]

[dependencies]
boule-core          = { path = "../boule-core", version = "0.1.0" }
boule-consensus     = { path = "../boule-consensus", version = "0.1.0" }
boule-node          = { path = "../boule-node", version = "0.1.0" }
boule-reth          = { path = "../boule-reth", version = "0.1.0", optional = true }
tokio              = { version = "1", features = ["full"] }
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hex                = "0.4"
bytes              = { version = "1", features = ["serde"] }
clap               = { version = "4", features = ["derive", "env"] }
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json         = "1"

# The CLI integration tests that used to live in `tests/` moved to
# `boule-bundle` in #897, so they run against the unified `boule` binary. The
# only remaining test-only dep is for the inline unit tests (e.g. rotation).
[dev-dependencies]
tempfile = "3"
