[package]
name = "boule-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line interface and node binary for boule, a HotStuff-style BFT consensus layer."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/boule-cli"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The node binary. `boule-core` exposes its library as `boule`, so both the
# binary and the testnet driver import it as `use boule::...`.
[[bin]]
name = "boule"
path = "src/main.rs"

# The `testnet` driver binary is auto-discovered from src/bin/testnet.rs.

[dependencies]
boule-core          = { path = "../boule-core", version = "0.1.0" }
boule-consensus     = { path = "../boule-consensus", version = "0.1.0" }
boule-transport-tcp = { path = "../boule-transport-tcp", version = "0.1.0" }
boule-node          = { path = "../boule-node", version = "0.1.0" }
tokio              = { version = "1", features = ["full"] }
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hex                = "0.4"
bytes              = { version = "1", features = ["serde"] }
clap               = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio              = { version = "1", features = ["full", "test-util"] }
tempfile           = "3"
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
libc               = "0.2"
futures-util       = { version = "0.3", features = ["sink"] }
